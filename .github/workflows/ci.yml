name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate skill frontmatter & bundled scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SKILL.md frontmatter and directory names
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path

          skills_dir = Path("skills")
          errors = []
          count = 0
          for skill_dir in sorted(p for p in skills_dir.iterdir() if p.is_dir()):
              skill_md = skill_dir / "SKILL.md"
              if not skill_md.is_file():
                  errors.append(f"{skill_dir}: missing SKILL.md")
                  continue
              count += 1
              text = skill_md.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  errors.append(f"{skill_md}: missing YAML frontmatter")
                  continue
              fm = m.group(1)
              name_m = re.search(r"^name:\s*(.+)$", fm, re.M)
              desc_m = re.search(r"^description:\s*(.+)$", fm, re.M)
              if not name_m:
                  errors.append(f"{skill_md}: missing 'name' in frontmatter")
              elif name_m.group(1).strip().strip('"\'') != skill_dir.name:
                  errors.append(
                      f"{skill_md}: frontmatter name {name_m.group(1).strip()!r} != dir {skill_dir.name!r}"
                  )
              if not desc_m or len(desc_m.group(1).strip()) < 10:
                  errors.append(f"{skill_md}: missing or too-short 'description' in frontmatter")

          if errors:
              for err in errors:
                  print(f"ERROR: {err}", file=sys.stderr)
              sys.exit(1)
          print(f"OK: validated {count} skills.")
          PY

      - name: Syntax-check all bundled Python scripts
        run: |
          python3 -m py_compile skills/*/scripts/*.py
          echo "OK: all bundled Python scripts compile cleanly."
